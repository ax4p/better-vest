<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Better Vest by Astra</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="" class="logo">
    <div>
      <div class="name">Better Vest</div>
      <div class="by">by Astra · <span id="ver"></span></div>
    </div>
  </header>

  <section id="cal" class="cal">
    <div class="cal-head">
      <span class="label cal-label">Calendar</span>
      <span id="cal-sync" class="cal-sync"></span>
    </div>
    <div class="cal-grid">
      <div><small>Today</small><b id="cal-today">—</b><i id="cal-today-n"></i></div>
      <div><small>Week</small><b id="cal-week">—</b><i id="cal-week-n"></i></div>
      <div><small>Month</small><b id="cal-month">—</b><i id="cal-month-n"></i></div>
    </div>
    <button id="open-cal" class="primary cal-open">Open Calendar <span class="kbd">Alt+J</span></button>
  </section>

  <section id="off" hidden>
    <p class="muted">Open Vest to use Better Vest.</p>
    <button id="open-vest" class="primary">Open next.vestmarkets.com</button>
  </section>

  <section id="on" hidden>
    <div class="status"><span id="dot" class="dot"></span><span id="status-text">connecting…</span></div>


    <div class="label">Panels</div>
    <div class="row">
      <button data-widget="exec">Exec</button>
      <button data-widget="settings">Settings</button>
    </div>

    <div class="label">Theme</div>
    <div id="themes" class="themes"></div>

    <div class="label">Focus <button id="focus-all" class="mini">Focus mode · Alt+F</button></div>
    <div class="row">
      <button data-hide="ticket">Order ticket</button>
      <button data-hide="positions">Positions</button>
      <button data-hide="book">Book</button>
      <button data-hide="leftTools">Draw bar</button>
    </div>
  </section>

  <script src="popup.js"></script>
</body>
</html>
