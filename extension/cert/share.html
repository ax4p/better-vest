<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P&amp;L card · Better Vest by Astral</title>
<link rel="icon" href="../icons/icon32.png">
<link rel="stylesheet" href="share-card.css">
<link rel="stylesheet" href="share-page.css">
</head>
<body>
<header class="bar">
    <div class="brand">
        <span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="m7 15 3.5-3.5 2.5 2.5L17 9.5"/><path d="M14 9.5h3v3"/></svg></span>
        <div><b>P&amp;L card</b><span id="sub">Today, from Vest</span></div>
    </div>
    <div class="seg" id="kind" aria-label="Which card"><button type="button" data-v="summary" title="Today's P&amp;L, one account or the copy group">Summary</button><button type="button" data-v="replay" title="Today's trades on Vest's own candles, every entry and exit">Replay</button></div>
    <div class="seg" id="mode" role="tablist" aria-label="What the card is about"><button type="button" data-v="accounts">Accounts</button><button type="button" data-v="copy">Copy trading</button></div>
    <div class="pop" id="pick-pop">
        <button type="button" class="ctl" id="pick-btn" aria-haspopup="true" aria-expanded="false"><span id="pick-t">Accounts</span><b id="pick-count"></b><svg class="chev" viewBox="0 0 12 12"><path d="M3 4.5 6 7.5 9 4.5"/></svg></button>
        <div class="dd" id="pick-panel" hidden><div class="ddh"><span id="pick-head"></span><span class="links"><button type="button" id="pick-all">All</button><button type="button" id="pick-none">None</button></span></div><div class="list" id="pick"></div><div class="note" id="pick-note"></div></div>
    </div>
    <!-- Replay only: which trades, and which time, the card shows -->
    <div class="pop" id="rpt-pop" hidden>
        <button type="button" class="ctl" id="rpt-btn" aria-haspopup="true" aria-expanded="false"><span>Trades</span><b id="rpt-count"></b><svg class="chev" viewBox="0 0 12 12"><path d="M3 4.5 6 7.5 9 4.5"/></svg></button>
        <div class="dd" id="rpt-panel" hidden><div class="ddh"><span>Trades on the card</span><span class="links"><button type="button" id="rpt-all">All</button><button type="button" id="rpt-none">None</button></span></div><div class="list" id="rpt"></div><div class="note" id="rpt-note"></div></div>
    </div>
    <div class="pop" id="rpr-pop" hidden>
        <button type="button" class="ctl" id="rpr-btn" aria-haspopup="true" aria-expanded="false"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span id="rpr-t">Whole session</span><svg class="chev" viewBox="0 0 12 12"><path d="M3 4.5 6 7.5 9 4.5"/></svg></button>
        <div class="dd tlp" id="rpr-panel" hidden>
            <div class="ddh"><span>Time on the card</span><span class="links"><button type="button" id="rpr-fit">Fit trades</button><button type="button" id="rpr-all">Whole session</button></span></div>
            <div class="tl" id="rpr-tl"><div class="spark" id="rpr-spark"></div><input type="range" id="rpr-a" aria-label="Start"><input type="range" id="rpr-b" aria-label="End"></div>
            <div class="tlv"><b id="rpr-from"></b><span id="rpr-len"></span><b id="rpr-to"></b></div>
        </div>
    </div>
    <div class="grow"></div>
    <button type="button" class="btn" id="copy" title="Copy the image (⌘C / Ctrl+C), then paste it into your post"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>Copy image</button>
    <button type="button" class="btn primary" id="save" title="Save the image as a PNG (⌘S / Ctrl+S)"><svg viewBox="0 0 24 24"><path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/></svg>Download PNG</button>
</header>
<nav class="opts" aria-label="How the card looks">
    <div class="grp"><span class="k">Theme</span><div class="seg sm" id="theme"><button type="button" data-v="dark">Dark</button><button type="button" data-v="light">Light</button></div></div>
    <div class="grp"><span class="k">Style</span><div class="seg sm" id="style"><button type="button" data-v="vest">Vest</button><button type="button" data-v="silver">Silver</button><button type="button" data-v="oled">OLED</button><button type="button" data-v="neon">Neon</button></div></div>
    <div class="grp"><span class="k">Format</span><div class="seg sm" id="format"><button type="button" data-v="feed" title="4:5, for the feed">4:5</button><button type="button" data-v="square" title="1:1">1:1</button><button type="button" data-v="wide" title="16:9, best on X">16:9</button><button type="button" data-v="story" title="9:16, for a story">9:16</button></div></div>
    <div class="grp"><span class="k">Number</span><div class="seg sm" id="hero"><button type="button" data-v="usd">$</button><button type="button" data-v="pct">%</button></div></div>
    <span class="vsep"></span>
    <div class="toggles" id="listopts"></div>
    <div class="pop" id="show-pop">
        <button type="button" class="ctl sm" id="show-btn" aria-haspopup="true" aria-expanded="false">Show<svg class="chev" viewBox="0 0 12 12"><path d="M3 4.5 6 7.5 9 4.5"/></svg></button>
        <div class="dd right" id="show-panel" hidden><div class="ddh"><span>On the card</span></div><div class="list" id="show"></div>
            <div class="field"><label for="handle">Your name</label><input class="txt" id="handle" maxlength="32" placeholder="@yourname (optional)" autocomplete="off" spellcheck="false"></div></div>
    </div>
</nav>
<main class="stage" id="stage">
    <div class="fit" id="fit"></div>
    <div class="empty" id="empty" hidden></div>
    <div class="cap" id="cap"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
</main>
<script type="module" src="share-page.js"></script>
</body>
</html>
