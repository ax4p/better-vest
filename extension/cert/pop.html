<html lang="en">
<head>
<meta charset="utf-8">
<title>P&amp;L card · Better Vest by Astral</title>
<link rel="stylesheet" href="share-card.css">
<link rel="stylesheet" href="pop.css">
</head>
<body>
<div class="pp" id="pp" hidden>
    <div class="pp-hd"><span class="pp-dot"></span><span class="pp-t" id="pp-t">Green exit</span>
        <button type="button" class="pp-x" id="pp-close" tabindex="-1" title="Close" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div class="pp-stage" id="pp-stage"><div class="pp-fit" id="pp-fit"></div></div>
    <div class="pp-acts">
        <button type="button" class="pp-btn pp-primary" id="pp-save" tabindex="-1" title="Save the card as a PNG"><svg viewBox="0 0 24 24"><path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/></svg>Save</button>
        <button type="button" class="pp-btn" id="pp-copy" tabindex="-1" title="Copy the image, then paste it into your post"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>Copy</button>
        <button type="button" class="pp-btn" id="pp-edit" tabindex="-1" title="Open the P&amp;L card page: every option, Replay, Payout, video"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></svg>Edit</button>
    </div>
    <div class="pp-ft"><button type="button" class="pp-sw" id="pp-never" role="switch" aria-checked="false" tabindex="-1"><i></i><span>Don't show again</span></button><span class="pp-note" id="pp-note"></span></div>
</div>
<div class="pp pr" id="pr" hidden>
    <div class="pr-hd"><span class="pr-b" aria-hidden="true"><svg viewBox="0 0 38 64"><polygon points="0,0 18,0 38,16 18,32 38,48 18,64 0,64"/></svg></span>
        <div class="pr-tt"><div class="pr-t" id="pr-t"></div><div class="pr-s" id="pr-s"></div></div>
        <button type="button" class="pp-x" id="pr-close" tabindex="-1" title="Close" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div class="pr-stage" id="pr-stage"><div class="pr-box" id="pr-box"><div class="pp-fit" id="pr-fit"></div></div></div>
    <div class="pr-acts">
        <button type="button" class="pp-btn pp-primary pr-main" id="pr-save" tabindex="-1" title="Save the card as a PNG">Save image</button>
        <button type="button" class="pp-btn" id="pr-video" tabindex="-1" hidden title="The day plays out: record it and save the video">Save video</button>
        <button type="button" class="pp-btn" id="pr-copy" tabindex="-1" title="Copy the image, then paste it into your post">Copy image</button>
        <button type="button" class="pp-btn" id="pr-post" tabindex="-1" title="Copies the image, then opens a new post on X: paste it there">Post on X</button>
    </div>
    <div class="pr-ft"><button type="button" class="pp-sw" id="pr-never" role="switch" aria-checked="false" tabindex="-1"><i></i><span>Don't show again</span></button>
        <span class="pp-note" id="pr-note"></span><button type="button" class="pr-link" id="pr-not" tabindex="-1">Not now</button></div>
</div>
<div class="pc" id="pc" hidden>
    <div class="pc-hd"><span class="pr-b" aria-hidden="true"><svg viewBox="0 0 38 64"><polygon points="0,0 18,0 38,16 18,32 38,48 18,64 0,64"/></svg></span><b>More from Better Vest</b></div>
    <div class="pc-tabs" id="pc-tabs"><button type="button" data-v="trade" tabindex="-1">This trade</button><button type="button" data-v="today" tabindex="-1">Today</button></div>
    <div class="pc-stage" id="pc-stage"><div class="pr-box" id="pc-box"><div class="pp-fit pc-fit" id="pc-fit"></div></div></div>
    <div class="pr-acts">
        <button type="button" class="pp-btn pp-primary pr-main" id="pc-video" tabindex="-1">Save image</button>
        <button type="button" class="pp-btn" id="pc-copy" tabindex="-1" title="Copy the image, then paste it into your post">Copy image</button>
        <button type="button" class="pp-btn" id="pc-post" tabindex="-1" title="Copies the image, then opens a new post on X: paste it there">Post on X</button>
    </div>
    <div class="pc-ft"><button type="button" class="pp-sw" id="pc-hide" role="switch" aria-checked="false" tabindex="-1"><i></i><span>Hide dollars</span></button>
        <span class="pr-fmt" id="pc-fmt"><button type="button" data-v="feed" tabindex="-1">4:5</button><button type="button" data-v="story" tabindex="-1">9:16</button><button type="button" data-v="square" tabindex="-1">1:1</button><button type="button" data-v="wide" tabindex="-1">16:9</button></span></div>
    <div class="pc-note" id="pc-note"></div>
</div>
<script type="module" src="pop.js"></script>

</html>
